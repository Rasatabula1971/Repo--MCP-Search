[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cip"
version = "0.1.0"
description = "Capability Intelligence Platform - Steps 0-13"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "PyYAML==6.0.2",
    "fastapi==0.115.0",
    "uvicorn>=0.31.1",
    "mcp>=1.30,<2.0",
]

[project.scripts]
cip-mcp = "mcp_server.server:main"
cip-composer = "cip_composer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "import-linter==2.1",
]

[tool.setuptools.packages.find]
include = ["core*", "workers*", "connectors*", "analysis*", "db*", "api*",
           "mcp_server*", "cip_composer*", "scripts*"]
exclude = ["tests*", "docs*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.importlinter]
root_packages = ["core", "api", "workers", "connectors", "analysis", "db"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not import from api or workers"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "workers"]

[[tool.importlinter.contracts]]
name = "core.scoring has no import path to any provider client"
type = "forbidden"
source_modules = ["core.scoring"]
forbidden_modules = [
    "core.judgment",
    "connectors",
    "google",
    "openai",
    "anthropic",
]
